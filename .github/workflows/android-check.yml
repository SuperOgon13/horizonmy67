name: android-build

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Remove Cargo.lock to force update
        run: rm Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android Build Tools
        shell: bash
        run: |
          # Устанавливаем нужные пакеты SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build for Android arm64
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a --platform 26 build -p horizon-client --no-default-features --release

      - name: Prepare APK structure
        shell: bash
        run: |
          mkdir -p apk/lib/arm64-v8a
          mkdir -p apk/assets
          
          # Копируем собранный .so файл
          cp target/aarch64-linux-android/release/libhorizon_client.so apk/lib/arm64-v8a/
          
          # Генерируем AndroidManifest.xml
          cat > apk/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.horizon.client">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Horizon Client" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                      android:exported="true">
                      <meta-data android:name="android.app.lib_name" android:value="horizon_client" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Package APK
        shell: bash
        run: |
          cd apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          
          # 1. Компилируем ресурсы
          $BUILD_TOOLS/aapt2 compile --dir . -o compiled.zip || true
          
          # 2. Линкуем манифест и ресурсы
          $BUILD_TOOLS/aapt2 link -o unsigned.apk -I $ANDROID_HOME/platforms/android-34/android.jar --manifest AndroidManifest.xml -A assets
          
          # 3. Добавляем файлы библиотек
          zip -r unsigned.apk lib/
          
          # 4. Выравниваем и подписываем
          $BUILD_TOOLS/zipalign -f 4 unsigned.apk aligned.apk
          
          # Создаем дебаг-ключ, если его нет
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          
          $BUILD_TOOLS/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out horizon-debug.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: apk/horizon-debug.apk
          retention-days: 5