# Проверка: собирается ли Horizon под Android (arm64).
# Запуск: вкладка Actions -> android-check -> Run workflow.
# Положить в форк как .github/workflows/android-check.yml
name: android-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: cargo check for Android arm64
        id: check
        continue-on-error: true
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a --platform 26 check -p horizon-client 2>&1 | tee check.log

      - name: Error summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Android check: ${{ steps.check.outcome }}'
            echo '```'
            grep -E 'error|could not compile|failed to' check.log | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
