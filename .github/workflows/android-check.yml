name: android-build

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Remove Cargo.lock to force update
        run: rm Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build for Android arm64
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a --platform 26 build -p horizon-client --no-default-features --release

      - name: Prepare APK structure
        shell: bash
        run: |
          mkdir -p apk/lib/arm64-v8a
          mkdir -p apk/assets
          
          # Ищем и копируем ВСЕ .so файлы из папки релиза
          find target/aarch64-linux-android/release/ -maxdepth 1 -name "*.so" -exec cp {} apk/lib/arm64-v8a/ \;
          
          # Если Rust собрал файл без расширения .so (как бинарник), переименовываем его
          if [ -f target/aarch64-linux-android/release/horizon-client ]; then
            cp target/aarch64-linux-android/release/horizon-client apk/lib/arm64-v8a/libhorizon_client.so
          fi
          
          # Выводим список файлов в лог, чтобы проверить, что скопировалось
          ls -la apk/lib/arm64-v8a/
          
          # Генерируем AndroidManifest.xml
          cat > apk/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.horizon.client">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Horizon Client" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                      android:exported="true">
                      <meta-data android:name="android.app.lib_name" android:value="horizon_client" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Package APK
        shell: bash
        run: |
          cd apk
          # 1. Компилируем ресурсы и манифест
          aapt2 compile --dir . -o compiled.zip || true
          aapt2 link -o unsigned.apk -I $ANDROID_HOME/platforms/android-35/android.jar --manifest AndroidManifest.xml -A assets
          
          # 2. Добавляем собранные библиотеки в APK
          zip -r unsigned.apk lib/
          
          # 3. Выравниваем и подписываем
          zipalign -f 4 unsigned.apk aligned.apk
          
          # Проверяем, есть ли дебаг-ключ, если нет — создаем
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          
          apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out horizon-debug.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: apk/horizon-debug.apk
          retention-days: 5