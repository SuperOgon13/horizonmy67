[workspace]
exclude = ["launcher", "crates/horizon-telemetry-server", "crates/horizon-mod-registry", "third_party/wgpu-hal", "third_party/winit"]
members = [
    "crates/horizon-core",
    "crates/horizon-dualsense",
    "crates/horizon-threads",
    "crates/horizon-hdr",
    "crates/horizon-world",
    "crates/horizon-client",
    "crates/horizon-client-core",
    "crates/horizon-client-input",
    "crates/horizon-client-render",
    "crates/horizon-command",
    "crates/horizon-items",
    "crates/horizon-server-files",
    "crates/horizon-server",
    "crates/horizon-bots",
    "crates/horizon-assets",
    "crates/horizon-protocol",
    "crates/horizon-theme",
    "crates/horizon-prepare",
    "crates/horizon-telemetry",
    "crates/horizon-bench",
    "crates/horizon-friends",
    "crates/horizon-relay",
    "crates/horizon-mod-sdk",
    "crates/horizon-mods",
    "crates/horizon-mods/tests/guest",
    "crates/horizon-mods/tests/ui_guest",
    "crates/cargo-horizon-mod",
    "crates/horizon-port-pack",
    "crates/horizon-shaders",
    "crates/horizon-shader-api",
    "crates/horizon-release-sign",
    "crates/horizon-mod-sdk/examples/coords-hud",
    "crates/horizon-mod-sdk/examples/predator-missile",
    "crates/horizon-mod-sdk/examples/welcome",
    "crates/horizon-mod-sdk/examples/beacons",
    "mods/official/fps-overlay",
    "mods/official/keystrokes",
    "mods/official/far-view",
    "mods/official/minimap",
    "mods/official/zoom",
    "xtask",
    "mods/official/recipes",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
arboard = { path = "third_party/arboard-stub" }
winit = { path = "third_party/winit" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true